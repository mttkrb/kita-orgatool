# Führt bei jedem Push und Pull Request die Tests aus, wie lokal mit npm test.
# PostgreSQL ist auf den Ubuntu-Runnern vorinstalliert; pruefen.sh findet initdb
# unter /usr/lib/postgresql/*/bin und startet einen eigenen temporären Server.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm test
