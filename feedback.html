<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rückmeldung</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=fraunces:600,700|work-sans:400,500,600" rel="stylesheet">
<script src="config.js"></script>
<script src="common.js"></script>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="eltern.css">
<style>
  .noten{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .note{flex:1;min-width:56px;padding:11px 4px;border:1px solid var(--line);border-radius:5px;
    background:#fff;font:inherit;font-size:.86rem;cursor:pointer;text-align:center;color:var(--ink)}
  .note.an{background:var(--moss);border-color:var(--moss);color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titel">Wie war es?</h1>
    <p class="lead" id="unter">Zwei Minuten, die das nächste Mal besser machen.</p>
  </header>

  <form id="form" autocomplete="off">
    <label>Wie war es insgesamt?</label>
    <div class="noten" id="noten">
      <button type="button" class="note" data-n="1">ging gar nicht</button>
      <button type="button" class="note" data-n="2">mäßig</button>
      <button type="button" class="note" data-n="3">okay</button>
      <button type="button" class="note" data-n="4">gut</button>
      <button type="button" class="note" data-n="5">richtig gut</button>
    </div>

    <label for="gut">Was war gut?</label>
    <textarea id="gut" placeholder="Was sollen wir unbedingt beibehalten?"></textarea>

    <label for="besser">Was sollen wir ändern?</label>
    <textarea id="besser" placeholder="Was hat gefehlt, gestört oder nicht funktioniert?"></textarea>

    <label for="wer">Dein Name <span style="font-weight:400;color:var(--ink-soft)">(freiwillig)</span></label>
    <input type="text" id="wer" placeholder="kannst du auch weglassen">
    <p class="hint">Die Rückmeldungen sieht nur das Orgateam, nicht die anderen Familien.</p>

    <button type="submit" class="primary" id="senden">Abschicken</button>
    <div id="error" class="error hidden"></div>
  </form>

  <div id="done" class="done hidden"></div>
</div>

<script>
const CONFIG = { supabase: SUPABASE };
const kopf = () => anonHead({ "Content-Type":"application/json" });
const eventId = new URLSearchParams(location.search).get("event");
let note = null;

$("noten").addEventListener("click", ev => {
  const b = ev.target.closest(".note");
  if(!b) return;
  note = +b.dataset.n;
  $("noten").querySelectorAll(".note").forEach(x=>x.classList.toggle("an", x === b));
});

(async function(){
  if(!live || !eventId) return;
  try{
    const r = await fetch(CONFIG.supabase.url +
      "/rest/v1/events?select=title,event_date,event_on&id=eq." + eventId, { headers: kopf() });
    const [ev] = await r.json();
    if(ev){
      $("titel").textContent = "Wie war " + ev.title + "?";
      titel("Rückmeldung — " + ev.title);
    }
  }catch(e){}
})();

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("error").classList.add("hidden");
  const gut = $("gut").value.trim(), besser = $("besser").value.trim();
  if(!note && !gut && !besser){
    $("error").textContent = "Gib wenigstens eine Note oder ein paar Worte mit.";
    $("error").classList.remove("hidden");
    return;
  }
  if(!eventId){
    $("error").textContent = "Der Link ist unvollständig. Frag im Orgateam nach dem richtigen.";
    $("error").classList.remove("hidden");
    return;
  }
  $("senden").disabled = true;
  $("senden").textContent = "Wird gesendet …";
  try{
    if(live){
      const r = await fetch(CONFIG.supabase.url + "/rest/v1/feedback", {
        method:"POST", headers: Object.assign(kopf(), { Prefer:"return=minimal" }),
        body: JSON.stringify({ event_id:eventId, rating:note, good:gut || null,
          better:besser || null, from_name:$("wer").value.trim() || null })
      });
      if(!r.ok) throw new Error((await r.text()).slice(0,150));
    }
    $("form").classList.add("hidden");
    $("done").classList.remove("hidden");
    $("done").innerHTML = "<p style=\"margin:0\"><strong>Danke.</strong> Das Orgateam liest alles " +
      "vor der Planung des nächsten Mals. Eine Antwort bekommst du nicht automatisch — " +
      "bei Rückfragen meldet sich jemand, falls du deinen Namen dagelassen hast.</p>";
    window.scrollTo({top:0, behavior:"smooth"});
  }catch(err){
    $("error").textContent = "Konnte nicht gesendet werden. " + err.message;
    $("error").classList.remove("hidden");
  }finally{
    $("senden").disabled = false;
    $("senden").textContent = "Abschicken";
  }
});
</script>
</body>
</html>
